name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crypto:
    name: crypto — typecheck, test, vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` installs exactly the committed lockfile and fails if
      # package.json and the lockfile disagree — see docs/threat-model.md, A8.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace @vault/crypto

      - name: Test
        run: npm test --workspace @vault/crypto

      # The crypto package must never acquire a runtime dependency. This is the
      # single most valuable supply-chain target in the product, so the rule is
      # enforced here rather than left to review.
      - name: Assert no runtime dependencies
        run: |
          deps=$(node -p "Object.keys(require('./packages/crypto/package.json').dependencies ?? {}).join(' ')")
          if [ -n "$deps" ]; then
            echo "::error::@vault/crypto must have no runtime dependencies, found: $deps"
            exit 1
          fi
          echo "confirmed: no runtime dependencies"

      # Vectors are published values, cross-checked against independent
      # implementations before being committed. Regenerating them from this
      # package would make the tests self-confirming.
      - name: Assert test vectors cite a published source
        run: |
          for f in packages/crypto/vectors/*.json; do
            src=$(node -p "require('./$f').source || ''")
            if [ -z "$src" ]; then
              echo "::error::$f has no 'source' field naming where its vectors come from"
              exit 1
            fi
            echo "$(basename "$f"): $src"
          done

  api:
    name: api — typecheck, test, bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace @vault/api

      - name: Test
        run: npm test --workspace @vault/api

      # A bundle that compiles but will not start is a deploy that fails after
      # the service has already been replaced. This starts the real bundle with
      # the real entry point and asks it a question over the real socket.
      - name: Bundle and boot
        working-directory: services/api
        run: |
          npm run bundle
          NOSQL_TABLE=ci \
          SERVER_PEPPER="$(openssl rand -base64 32)" \
          TOKEN_SIGNING_KEY="$(openssl rand -base64 48)" \
          PORT=3123 node dist-bundle/index.mjs &
          pid=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3123/api/health >/dev/null && break
            sleep 1
          done
          body=$(curl -sf --max-time 5 http://127.0.0.1:3123/api/health)
          kill $pid
          echo "health said: $body"
          [ "$body" = '{"status":"ok"}' ] || { echo "::error::the bundle did not serve health"; exit 1; }

      # The service must refuse to start on a placeholder or short secret. A
      # vault that comes up with a guessable pepper is worse than one that does
      # not come up, because nothing about it looks wrong.
      - name: Refuses a weak secret
        working-directory: services/api
        run: |
          if NOSQL_TABLE=ci SERVER_PEPPER=placeholder TOKEN_SIGNING_KEY=placeholder \
             node dist-bundle/index.mjs 2>/dev/null; then
            echo "::error::the service started with a placeholder secret"
            exit 1
          fi
          echo "confirmed: refuses to start on a placeholder secret"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
