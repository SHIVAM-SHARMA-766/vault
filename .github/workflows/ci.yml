name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crypto:
    name: crypto & core — typecheck, test, vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` installs exactly the committed lockfile and fails if
      # package.json and the lockfile disagree — see docs/threat-model.md, A8.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace @vault/crypto

      - name: Test
        run: npm test --workspace @vault/crypto

      # @vault/core is held to the same rule: no runtime dependencies, and its
      # QR encoder is checked against vectors from an independent library.
      - name: Test the core package
        run: npm test --workspace @vault/core

      # The crypto package must never acquire a runtime dependency. This is the
      # single most valuable supply-chain target in the product, so the rule is
      # enforced here rather than left to review.
      - name: Assert no runtime dependencies
        run: |
          for pkg in crypto core; do
            deps=$(node -p "Object.keys(require('./packages/$pkg/package.json').dependencies ?? {}).join(' ')")
            if [ -n "$deps" ]; then
              echo "::error::@vault/$pkg must have no runtime dependencies, found: $deps"
              exit 1
            fi
          done
          echo "confirmed: crypto and core have no runtime dependencies"

      # Vectors are published values, cross-checked against independent
      # implementations before being committed. Regenerating them from this
      # package would make the tests self-confirming.
      - name: Assert test vectors cite a published source
        run: |
          for f in packages/crypto/vectors/*.json; do
            src=$(node -p "require('./$f').source || ''")
            if [ -z "$src" ]; then
              echo "::error::$f has no 'source' field naming where its vectors come from"
              exit 1
            fi
            echo "$(basename "$f"): $src"
          done

  api:
    name: api — typecheck, test, bundle
    runs-on: ubuntu-latest

    # A real MySQL, so the storage adapter is tested rather than assumed. The
    # routes are tested against an in-memory store, which is only honest if
    # that store behaves like this one — test/store-contract.test.ts runs the
    # same assertions against both.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-not-a-real-password
          MYSQL_DATABASE: vault
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: ci-not-a-real-password
      DB_NAME: vault

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # The API imports @vault/crypto (identity-key validation), whose types
      # are its compiled output; a clean runner has none until this runs.
      - name: Build the crypto package
        run: npm run build --workspace @vault/crypto

      - name: Typecheck
        run: npm run typecheck --workspace @vault/api

      - name: Test
        run: npm test --workspace @vault/api

      # A bundle that compiles but will not start is a deploy that fails after
      # the service has already been replaced. This starts the real bundle
      # against the real database and asks it a question over the real socket.
      - name: Bundle and boot
        working-directory: services/api
        run: |
          npm run bundle
          site_out="$(mktemp -d)"
          SERVER_PEPPER="$(openssl rand -base64 32)" \
          TOKEN_SIGNING_KEY="$(openssl rand -base64 48)" \
          SITE_SOURCE="$GITHUB_WORKSPACE/apps/site" SITE_ROOT="$site_out" \
          VAULT_HOSTNAME=vault.ci.test PORT=3123 node dist-bundle/index.mjs &
          pid=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3123/api/health >/dev/null && break
            sleep 1
          done
          body=$(curl -sf --max-time 5 http://127.0.0.1:3123/api/health)
          kill $pid
          echo "health said: $body"
          [ "$body" = '{"status":"ok"}' ] || { echo "::error::the bundle did not serve health"; exit 1; }
          # The bundle renders the public site as it starts; on the host that is
          # what Caddy serves. Prove the bundled renderer produced pages.
          for page in index.html security.html 404.html; do
            [ -s "$site_out/current/$page" ] || { echo "::error::the bundle did not render $page"; exit 1; }
          done
          echo "confirmed: the bundle rendered the website"

      # The service must refuse to start on a placeholder or short secret. A
      # vault that comes up with a guessable pepper is worse than one that does
      # not come up, because nothing about it looks wrong.
      - name: Refuses a weak secret
        working-directory: services/api
        run: |
          if SERVER_PEPPER=placeholder TOKEN_SIGNING_KEY=placeholder \
             node dist-bundle/index.mjs 2>/dev/null; then
            echo "::error::the service started with a placeholder secret"
            exit 1
          fi
          echo "confirmed: refuses to start on a placeholder secret"

      # A vault that comes up without a database would answer health and fail
      # every request that matters. Refusing to start is the correct answer.
      - name: Refuses an unreachable database
        working-directory: services/api
        run: |
          if DB_HOST=127.0.0.1 DB_PORT=3307 \
             SERVER_PEPPER="$(openssl rand -base64 32)" \
             TOKEN_SIGNING_KEY="$(openssl rand -base64 48)" \
             node dist-bundle/index.mjs 2>/dev/null; then
            echo "::error::the service started without a database"
            exit 1
          fi
          echo "confirmed: refuses to start without a database"

  web:
    name: web — typecheck, build, policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # The client imports @vault/crypto, whose types are its compiled output.
      # Without this the typecheck fails on a clean checkout, while passing on
      # any machine that happens to have an old build lying around.
      - name: Build the crypto and core packages
        run: npm run build --workspace @vault/crypto --workspace @vault/core

      - name: Typecheck
        run: npm run typecheck --workspace @vault/web

      # The build runs check-csp.mjs at the end. A build that violates the
      # Content-Security-Policy it is served under does not fail at build time
      # — the page is simply blank, and the reason is in a browser console
      # nobody is watching during a deploy.
      - name: Build and check the policy
        run: npm run build --workspace @vault/web

  site:
    name: site — render, policy, links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Renders the templates with the default content and fails on inline
      # script or style, remote resources, missing titles, broken links, and
      # defaults that do not satisfy the content schema.
      - name: Render and check
        run: npm run build --workspace @vault/site

  e2e:
    name: e2e — the product in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Everything the dev stack serves: the API, the client, the site.
      - name: Build
        run: npm run build

      # Starts scripts/dev-stack.mjs per test and drives the runner's own
      # Chrome through sign-up, the vault, roles and website publishing, under
      # the Content-Security-Policy from the Caddyfile.
      - name: Browser tests
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
