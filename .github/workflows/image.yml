name: Image release

# Publishes the self-hosted image when a version tag is pushed (v1.2.3).
# Nothing here runs on an ordinary merge: tagging a release is a deliberate
# act by the maintainer.
#
# What a customer gets, and can check:
#   - one multi-architecture image (linux/amd64, linux/arm64) at
#     ghcr.io/<owner>/vault:<version> and :latest
#   - an SBOM and SLSA build provenance attached to the image by BuildKit
#   - a Sigstore signature made with this workflow's own OIDC identity — no
#     signing key exists to be stolen from CI; verify with:
#       cosign verify ghcr.io/<owner>/vault:<version> \
#         --certificate-identity-regexp 'https://github.com/<owner>/vault/.github/workflows/image.yml@refs/tags/v.*' \
#         --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   - a CycloneDX SBOM of the npm dependencies as a release asset

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0), for a re-run'
        required: true

permissions:
  contents: write      # the GitHub release and its SBOM asset
  packages: write      # push to ghcr.io
  id-token: write      # keyless signing
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          v="${{ inputs.version || github.ref_name }}"; v="${v#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vault" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # The same gates as CI, on the exact commit being published.
      - name: Test
        run: npm run build && npm test

      - name: SBOM (npm dependencies)
        run: npm sbom --omit dev --sbom-format cyclonedx > vault-${{ steps.v.outputs.version }}.cdx.json

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: cosign sign --yes "${{ steps.v.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" --verify-tag --generate-notes \
            --title "Vault ${{ steps.v.outputs.version }}" \
            "vault-${{ steps.v.outputs.version }}.cdx.json" \
            || gh release upload "v${{ steps.v.outputs.version }}" "vault-${{ steps.v.outputs.version }}.cdx.json" --clobber
