#cloud-config
# First boot. Everything after this is done by the deploy pipeline.
#
# Caddy terminates TLS with a certificate it obtains itself, serves the built
# client from disk, sets the security headers, and proxies /api/* to the Node
# process on localhost. The client and the API therefore share an origin
# without anything sitting in front of them.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - unattended-upgrades

write_files:
  # Staged, not written to /etc/caddy/Caddyfile directly. cloud-init runs
  # write_files before runcmd, so a Caddyfile already in place when the
  # package installs makes dpkg prompt about a conffile it did not ship —
  # non-interactively that fails, the package stays unconfigured, its
  # postinst never runs, and the caddy user is never created. The service
  # then dies with status=217/USER, which names none of that.
  - path: /etc/caddy/Caddyfile.vault
    owner: root:root
    permissions: "0644"
    content: |
      {
        email ${acme_email}
      }

      ${hostname} {
        encode zstd gzip

        # The API. Same origin as the client, which is what lets the policy
        # below say connect-src 'self'.
        handle /api/* {
          reverse_proxy 127.0.0.1:3000
        }

        handle {
          root * /srv/vault/web
          # A path with no file behind it is a client-side route. A missing
          # asset still returns a real 404 rather than quietly becoming HTML.
          try_files {path} /index.html
          file_server
        }

        header {
          # No unsafe-inline and no unsafe-eval anywhere. The build must emit
          # external scripts and stylesheets only; an inline <script> is
          # blocked rather than silently trusted.
          #
          # img-src omits remote hosts deliberately. Fetching site favicons
          # from a third party would tell that third party which services the
          # vault holds accounts for, which is most of what the encryption is
          # protecting.
          Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
          Strict-Transport-Security "max-age=63072000; includeSubDomains"
          X-Content-Type-Options "nosniff"
          X-Frame-Options "DENY"
          Referrer-Policy "no-referrer"
          Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
          Cross-Origin-Opener-Policy "same-origin"
          Cross-Origin-Resource-Policy "same-origin"
          -Server
        }

        # API responses are per-user and must never be cached anywhere.
        header /api/* Cache-Control "no-store"
      }

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root:root
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # Node 20 from NodeSource. The runtime the API is built and tested against.
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs

  # Caddy from its own repository.
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt | tee /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y caddy
  # Only now that the package has shipped its own Caddyfile and created its user.
  - install -o root -g root -m 0644 /etc/caddy/Caddyfile.vault /etc/caddy/Caddyfile

  - useradd --system --home /srv/vault --shell /usr/sbin/nologin vault || true
  - mkdir -p /srv/vault/web /srv/vault/api/run
  - chown -R vault:vault /srv/vault

  # A placeholder so the site answers before the first deploy, which is also
  # what lets Caddy complete the ACME challenge.
  - sh -c 'printf "<!doctype html><title>vault</title><p>Not deployed yet." > /srv/vault/web/index.html'
  - chown vault:vault /srv/vault/web/index.html

  # OCI's network security group is the real boundary; the host firewall is a
  # second one that survives a mistake in the first.
  #
  # OCI's Ubuntu images ship an iptables INPUT chain that accepts SSH and then
  # REJECTs everything else — and that REJECT sits ahead of the chains ufw
  # installs, so ufw's rules are never reached. Enabling ufw alone leaves 80
  # and 443 closed while `ufw status` cheerfully reports them open, which is
  # the most misleading possible combination. These insert ahead of the
  # REJECT; ufw is kept as the second layer.
  - iptables -I INPUT 5 -p tcp -m state --state NEW -m tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 6 -p tcp -m state --state NEW -m tcp --dport 443 -j ACCEPT
  - [ bash, -c, "DEBIAN_FRONTEND=noninteractive apt-get install -y iptables-persistent >/dev/null 2>&1 || true" ]
  - [ bash, -c, "netfilter-persistent save >/dev/null 2>&1 || (mkdir -p /etc/iptables && iptables-save > /etc/iptables/rules.v4)" ]
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # `enable --now` is not enough here. Installing the package already started
  # Caddy, with the default Caddyfile it shipped — and --now does nothing to a
  # service that is already running, so it would keep serving that default
  # until something restarted it. The symptom is a working server showing
  # "Caddy works!" over plain HTTP with no certificate, which looks like a
  # configuration that was never copied rather than one that was never loaded.
  - systemctl enable caddy
  - systemctl restart caddy
  # The vault-api unit is deliberately not here. It describes how the code
  # runs, so it belongs with the code — services/api/vault-api.service,
  # installed by scripts/deploy.sh. Keeping it in cloud-init would mean every
  # change to how the service starts replaced the whole machine.
