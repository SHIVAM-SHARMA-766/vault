# Vault, personal profile: one Vault container on SQLite, and Caddy for HTTPS.
# For one person, a family or a small team, on anything from a Raspberry Pi
# to a cloud VM.
#
#   cp .env.example .env    # set VAULT_HOSTNAME (and ACME_EMAIL)
#   docker compose up -d
#   docker compose logs vault | grep -A6 "First-run setup"   # the owner link
#
# Everything to back up is in the vault-data volume. See docs/INSTALL.md.

name: vault

services:
  vault:
    image: ${VAULT_IMAGE:-vault:local}
    build: ../..
    restart: unless-stopped
    # Every setting in .env reaches Vault (backups, mail — docs/configuration.md).
    env_file: [.env]
    environment:
      VAULT_HOSTNAME: ${VAULT_HOSTNAME:?set VAULT_HOSTNAME in .env}
      # Only when HTTPS is not on 443, e.g. https://vault.example.com:8443
      SITE_ORIGIN: ${SITE_ORIGIN:-}
    volumes:
      - vault-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_HOSTNAME: ${VAULT_HOSTNAME}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  vault-data:
  caddy-data:
  caddy-config:
