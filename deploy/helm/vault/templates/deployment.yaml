apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vault.fullname" . }}
  labels: {{- include "vault.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Never two at once: the new pod starts after the old one has let go of /data.
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "vault.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "vault.selector" . | nindent 8 }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: vault
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: VAULT_HOSTNAME, value: {{ required "hostname is required" .Values.hostname | quote }} }
            # The ingress sets X-Forwarded-For; trust it for client addresses.
            - { name: TRUST_PROXY, value: "true" }
            - { name: DB_DRIVER, value: {{ .Values.database.driver | quote }} }
            {{- if eq .Values.database.driver "sqlite" }}
            - { name: DB_PATH, value: /data/vault.db }
            {{- else }}
            - { name: DB_HOST, value: {{ required "database.host is required for postgres" .Values.database.host | quote }} }
            - { name: DB_PORT, value: {{ .Values.database.port | quote }} }
            - { name: DB_NAME, value: {{ .Values.database.name | quote }} }
            - { name: DB_USER, value: {{ .Values.database.user | quote }} }
            - { name: DB_SSL, value: {{ .Values.database.ssl | quote }} }
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef: { name: {{ .Values.existingSecret }} }
          {{- end }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "vault.fullname" .) }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
